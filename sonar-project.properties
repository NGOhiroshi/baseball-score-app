# SonarQube Cloud / Server 共通の解析設定
# 詳細: https://docs.sonarsource.com/sonarcloud/

# ⚠️ projectKey と organization は SonarQube Cloud で Project 作成後に
#    Information ペインに表示される値で置き換える。
sonar.projectKey=NGOhiroshi_baseball-score-app
sonar.organization=ngohiroshi

# 表示名（任意）
sonar.projectName=baseball-score-app

# 解析対象
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts

# 解析対象から除外（ビルド成果物・型定義・テストはカバレッジでも除外）
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.d.ts,\
  next-env.d.ts

# 重複・複雑度の計測からテストは除外
sonar.coverage.exclusions=\
  **/*.test.ts,\
  src/app/**/page.tsx,\
  src/app/**/layout.tsx,\
  src/app/**/route.ts,\
  src/components/**

# Vitest が出力した lcov を読ませる
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript のプロジェクト設定（型情報を使った解析の手がかり）
sonar.typescript.tsconfigPath=tsconfig.json
